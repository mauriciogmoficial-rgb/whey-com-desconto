<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whey com Desconto | Melhores Ofertas do Dia</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        header { text-align: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        header h1 { margin: 0; color: #ff007f; font-size: 28px; }
        header p { margin: 5px 0 0 0; color: #666; }
        .container { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; }
        
        /* Barra Lateral de Filtros */
        .sidebar { width: 260px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); height: fit-content; }
        .sidebar h3 { font-size: 16px; border-bottom: 2px solid #f4f6f9; padding-bottom: 10px; margin-top: 0; color: #111; }
        .filter-group { margin-bottom: 25px; }
        .filter-group label { display: flex; align-items: center; margin: 10px 0; font-size: 14px; color: #555; cursor: pointer; }
        .filter-group input[type="checkbox"] { margin-right: 10px; width: 16px; height: 16px; }
        .price-slider-container { display: flex; flex-direction: column; gap: 8px; }
        .price-text { font-size: 14px; font-weight: bold; color: #ff007f; }
        
        /* Grade de Produtos */
        .main-content { flex: 1; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; padding: 15px; text-align: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .badge-oferta { background-color: #ff007f; color: white; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; position: absolute; top: 10px; left: 10px; text-transform: uppercase; }
        .product-img { max-width: 140px; height: 150px; object-fit: contain; margin: 15px auto; }
        .product-title { font-size: 14px; font-weight: 500; color: #333; margin: 10px 0; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-align: left; line-height: 20px; }
        .price-old { text-decoration: line-through; color: #999; font-size: 12px; height: 15px; text-align: left; }
        .price-current { color: #111; font-size: 22px; font-weight: bold; margin: 2px 0; text-align: left; }
        .btn-afiliado { display: block; background-color: #3483fa; color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; font-size: 14px; transition: background 0.2s; }
        .btn-afiliado:hover { background-color: #1e62cb; }
        .no-results { text-align: center; padding: 40px; color: #666; font-size: 16px; grid-column: 1 / -1; }
    </style>
</head>
<body>

<header>
    <h1>⚡ WHEY COM DESCONTO ⚡</h1>
    <p>As Melhores Ofertas de Suplementos do Mercado Livre Buscadas em Tempo Real</p>
</header>

<div class="container">
    <aside class="sidebar">
        <div class="filter-group">
            <h3>Filtrar por Marca</h3>
            <label><input type="checkbox" class="filtro-marca" value="max"> Max Titanium</label>
            <label><input type="checkbox" class="filtro-marca" value="integral"> Integralmedica</label>
            <label><input type="checkbox" class="filtro-marca" value="growth"> Growth Supplements</label>
            <label><input type="checkbox" class="filtro-marca" value="probiotica"> Probiótica</label>
        </div>
        
        <div class="filter-group">
            <h3>Preço Máximo</h3>
            <div class="price-slider-container">
                <input type="range" id="priceRange" min="0" max="600" value="600" step="10" style="width: 100%;">
                <span class="price-text" id="priceValue">Até R\$ 600,00</span>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="product-grid" id="vitrine">
            <div class="no-results">Buscando os Wheys mais vendidos direto do Mercado Livre...</div>
        </div>
    </main>
</div>

<script>
    const ID_AFILIADO_ML = "55954375"; 
    let todosOsProdutos = [];
    const vitrine = document.getElementById('vitrine');
    const checkboxesMarca = document.querySelectorAll('.filtro-marca');
    const priceRange = document.getElementById('priceRange');
    const priceValue = document.getElementById('priceValue');

    // Montagem da URL utilizando uma ponte CORS alternativa ultra leve e rápida
    const urlAlvo = "https://mercadolibre.com";
    const urlProxy = "https://codetabs.com" + encodeURIComponent(urlAlvo);

    fetch(urlProxy)
        .then(response => {
            if (!response.ok) throw new Error("Falha no carregamento.");
            return response.json();
        })
        .then(data => {
            const itens = data.results || [];
            
            todosOsProdutos = itens.map(item => {
                const linkOriginal = item.permalink || "";
                const urlLimpa = linkOriginal.split("?")[0];
                const linkAfiliado = "https://mercadolivre.com" + ID_AFILIADO_ML + "&target=" + encodeURIComponent(urlLimpa);
                
                let imagemSegura = item.thumbnail ? item.thumbnail.replace("-I.jpg", "-O.jpg") : "";
                if (imagemSegura.startsWith("http://")) {
                    imagemSegura = imagemSegura.replace("http://", "https://");
                }

                return {
                    titulo: item.title,
                    precoOriginal: item.original_price || item.price,
                    precoAtual: item.price,
                    imagem: imagemSegura,
                    link: linkAfiliado,
                    desconto: item.original_price ? Math.round(((item.original_price - item.price) / item.original_price) * 100) : 0
                };
            });

            renderizarProdutos(todosOsProdutos);
        })
        .catch(err => {
            console.error("Erro na busca de dados:", err);
            vitrine.innerHTML = "<div class='no-results'>Erro ao conectar com o Mercado Livre. Atualize a página.</div>";
        });

    function renderizarProdutos(lista) {
        vitrine.innerHTML = "";
        if (lista.length === 0) {
            vitrine.innerHTML = "<div class='no-results'>Nenhuma oferta encontrada com esses filtros.</div>";
            return;
        }

        lista.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            const precoFormatado = prod.precoAtual.toFixed(2).replace('.', ',');
            const precoAntigoFormatado = prod.precoOriginal.toFixed(2).replace('.', ',');
            const tagDesconto = prod.desconto > 0 ? `<span class="badge-oferta">\${prod.desconto}% OFF</span>` : '<span class="badge-oferta">Destaque</span>';

            card.innerHTML = `
                \${tagDesconto}
                <img src="\${prod.imagem}" alt="\${prod.titulo}" class="product-img">
                <div class="product-title">\${prod.titulo}</div>
                <div>
                    <div class="price-old">\${prod.desconto > 0 ? 'R$ ' + precoAntigoFormatado : ''}</div>
                    <div class="price-current">R$ \${precoFormatado}</div>
                </div>
                <a href="\${prod.link}" target="_blank" class="btn-afiliado">Ir para a Loja</a>
            `;
            vitrine.appendChild(card);
        });
    }

    function aplicarFiltros() {
        const marcasSelecionadas = Array.from(checkboxesMarca).filter(cb => cb.checked).map(cb => cb.value);
        const precoMaximo = parseFloat(priceRange.value);
        priceValue.textContent = "Até R\$ " + precoMaximo.toFixed(2).replace('.', ',');

        const produtosFiltrados = todosOsProdutos.filter(prod => {
            const tituloMinusculo = prod.titulo.toLowerCase();
            let passaMarca = marcasSelecionadas.length === 0 || marcasSelecionadas.some(marca => tituloMinusculo.includes(marca));
            const passaPreco = prod.precoAtual <= precoMaximo;
            return passaMarca && passaPreco;
        });

        renderizarProdutos(produtosFiltrados);
    }

    checkboxesMarca.forEach(cb => cb.addEventListener('change', aplicarFiltros));
    priceRange.addEventListener('input', aplicarFiltros);
</script>

</body>
</html>
