<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whey Com Desconto | Mais Vendidos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .product-card { background: white; border-radius: 8px; padding: 15px; text-align: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .badge-desconto { background-color: #00a650; color: white; padding: 3px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; position: absolute; top: 10px; left: 10px; }
        .product-img { max-width: 130px; height: 150px; object-fit: contain; margin: 15px auto; }
        .product-title { font-size: 14px; font-weight: 500; color: #333; margin: 10px 0; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-align: left; }
        .price-old { text-decoration: line-through; color: #999; font-size: 12px; height: 15px; text-align: left; }
        .price-current { color: #333; font-size: 22px; font-weight: bold; margin: 5px 0; text-align: left; }
        .btn-loja { display: block; background-color: #3483fa; color: white; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-top: 10px; transition: background 0.2s; }
        .btn-loja:hover { background-color: #2968c8; }
    </style>
</head>
<body>

    <h1>🔥 Os 100 Wheys Mais Vendidos do Mercado Livre</h1>
    <div class="product-grid" id="vitrine"></div>

    <script>
        fetch('produtos.json')
            .then(response => response.json())
            .then(produtos => {
                const vitrine = document.getElementById('vitrine');
                produtos.forEach(prod => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        \${prod.desconto > 0 ? `<span class="badge-desconto">-\${prod.desconto}% OFF</span>` : ''}
                        <img src="\${prod.imagem}" alt="\${prod.titulo}" class="product-img">
                        <div class="product-title">\${prod.titulo}</div>
                        <div>
                            <div class="price-old">\${prod.desconto > 0 ? 'R$ ' + prod.precoOriginal.toFixed(2).replace('.', ',') : ''}</div>
                            <div class="price-current">R$ \${prod.precoAtual.toFixed(2).replace('.', ',')}</div>
                        </div>
                        <a href="\${prod.link}" target="_blank" class="btn-loja">Ir para a Loja</a>
                    `;
                    vitrine.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('vitrine').innerHTML = "<p>Carregando as melhores ofertas do dia...</p>";
            });
    </script>
</body>
</html>
