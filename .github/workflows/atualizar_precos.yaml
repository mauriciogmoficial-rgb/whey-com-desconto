name: Atualizador Automatico de Precos

on:
  schedule:
    - cron: '0 */4 * * *' # Executa sozinho a cada 4 horas
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente se quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python no Servidor
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias do Robo
      run: |
        pip install requests beautifulsoup4 pandas openpyxl

    - name: Executar o Robo Comparador
      run: python robo_precos.py

    - name: Salvar alteracoes e enviar pro site
      run: |
        git config --global user.name "Robo Atualizador"
        git config --global user.email "robo@wheycomdesconto.com.br"
        git add index.html ir.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Preços atualizados automaticamente" && git push)
