name: Vitrine Diario

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar o produtos.json de volta no repositório

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Buscar Produtos no Mercado Livre
      run: node fetch-products.js

    - name: Salvar alteracoes e enviar para o GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add produtos.json
        git diff-index --quiet HEAD || git commit -m "Automação: Vitrine de Wheys atualizada"
        git push
