name: Executar Scrap do Mercado Livre

on:
  workflow_dispatch:

jobs:
  rodar-scrap:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executar Script Python
      run: |
        echo "whey" | python scraping/scrap.py

    - name: Salvar produtos.json gerado
      uses: actions/upload-artifact@v4
      with:
        name: resultado-produtos-json
        path: scraping/produtos.json
