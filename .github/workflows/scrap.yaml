name: Executar Scrap do Mercado Livre

on:
  workflow_dispatch:

jobs:
  rodar-scrap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Executar Script Python Autenticado via Google
      # Injeta as chaves do cofre direto na memória do script Python na nuvem
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
      run: |
        python scraping/scrap.py

    - name: Salvar produtos.json automaticamente no repositório
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add scraping/produtos.json
        git commit -m "Automação: Sincroniza 60 suplementos dinamicamente via Google Search" || echo "Sem alterações para salvar"
        git push
